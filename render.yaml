# One-click deploy, for the launch that has no customers yet.
#
# DEPLOY.md is the full account and still governs. This file exists so the
# first deploy is a button rather than an afternoon: Render reads it,
# builds the Dockerfile, attaches the disk, generates the secrets and
# hands back an https address. That address is enough to point a real
# sensor at, which is the step everything else is waiting on.
#
#   render.com -> New -> Blueprint -> pick this repository
#
# Three choices below are forced by the application, not by taste:
#
# **`plan: starter`, not `free`.** A free instance has no disk and sleeps
# after fifteen idle minutes. Both are fatal here and neither is obvious:
# without a disk the database dies with the container, and a sleeping
# instance runs no sweep, so a freezer fails at 3am to a process that is
# not running. The product's whole claim is that something is awake. That
# costs about $7 a month plus pennies for the disk.
#
# **`healthCheckPath: /api/health`, not `/api/watchdog`.** The watchdog
# answers 503 on purpose when the sweep has gone quiet -- that is what it
# is for. Handed to a platform health check it reads as "kill this
# container", and a stalled sweep becomes a restart loop that hides the
# stall it was built to expose.
#
# **One instance.** The sweep runs in-process, so a second instance
# escalates the same incident twice: two calls, two texts, one freezer.
# To scale out, set CYBERLOGIX_SWEEP_SECONDS=0 and drive
# POST /api/autopilot/sweep from an external scheduler instead.

services:
  - type: web
    name: cyberlogix
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    branch: claude/cyberlogix-ai-build-s8ckdi
    numInstances: 1
    healthCheckPath: /api/health
    autoDeploy: false

    # SQLite lives here. Without this the database is inside the
    # container's own filesystem, which is discarded on every deploy --
    # so every customer, sensor and reading vanishes the next time you
    # push a change, silently and with the site still up.
    disk:
      name: cyberlogix-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      - key: CYBERLOGIX_DB_PATH
        value: /app/data/cyberlogix.db

      # Backups on the same disk as the database. This survives a bad
      # migration and does NOT survive a lost disk -- the two failures a
      # backup exists for, and this covers one. Render allows a service
      # one disk, so the other half is copying snapshots off the machine,
      # which nothing here does for you. See DEPLOY.md section 7.
      - key: CYBERLOGIX_BACKUP_DIR
        value: /app/data/backups

      # Generated by Render, shown once in its dashboard, never typed by
      # a person and never in this repository. The admin key reads every
      # customer's contact details.
      - key: CYBERLOGIX_ADMIN_KEY
        generateValue: true
      - key: CYBERLOGIX_MAIL_SECRET
        generateValue: true

      - key: CYBERLOGIX_SWEEP_SECONDS
        value: "60"

      # Render's proxy sits in front of the app, so every request arrives
      # from the proxy's address. Without this, every visitor shares one
      # "caller", and thirty wrong passwords from anyone would lock everybody
      # out of signing in. The app reads the address Render adds last.
      - key: CYBERLOGIX_TRUST_PROXY_HEADER
        value: "1"

      # Paste the service's own https address here after the first
      # deploy, then redeploy. Until it is set a voice call still goes
      # out and pressing 1 reaches nothing, so the alert escalates to the
      # next person as though it had been ignored.
      - key: PUBLIC_BASE_URL
        sync: false

      # Lets the operator create a paid account directly. Leaving it unset
      # does NOT make this trials-only: any owner can still move off the
      # trial from the console and be invoiced. Set it when you need to
      # provision paid accounts yourself.
      - key: CYBERLOGIX_PROVISIONING_KEY
        sync: false

      # Everything below is dry-run until filled in. Nothing is lost while
      # they are blank -- alerts are still composed, incidents still open
      # and escalate, and each delivery is recorded as not_configured
      # rather than dropped. Fill them in Render's dashboard, not here.
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: CYBERLOGIX_HEARTBEAT_URL
        sync: false

      # Your own address, e.g. https://alerts.yourcompany.com. Left unset,
      # any website may call the API from a visitor's browser.
      - key: CYBERLOGIX_ALLOWED_ORIGINS
        sync: false

      # Email. Without these, invoices, reminders and password resets are
      # written down and never reach anyone. See DEPLOY.md for SPF/DKIM.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CYBERLOGIX_OPERATOR_EMAIL
        sync: false

      # Payments and the details every invoice must carry.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CYBERLOGIX_PAY_URL
        sync: false
      - key: CYBERLOGIX_LEGAL_NAME
        sync: false
      - key: CYBERLOGIX_ADDRESS
        sync: false
      - key: CYBERLOGIX_TAX_ID
        sync: false
      - key: CYBERLOGIX_REMIT_TO
        sync: false
