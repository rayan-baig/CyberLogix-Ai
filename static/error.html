<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberLogix AI — %%TITLE%%</title>
<meta name="robots" content="noindex">
<!-- The page a browser gets for a missing page (404) or a fault (500).
     Filled in by main.py. A 500 carries a reference code and never the
     error itself. -->
<meta name="theme-color" content="%%THEME_COLOR%%">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/static/logo-mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/pages.css">
<script src="/static/circuit.js" defer></script>
</head>
<body>
<canvas id="circuit" class="circuit" aria-hidden="true"></canvas>
<div class="circuit-veil" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="/" aria-label="CyberLogix AI home">
    <img src="/static/logo.svg" alt="" width="26" height="26">
    <span class="brand-name">CyberLogix AI</span>
  </a>
  <nav aria-label="Elsewhere">
    <a href="/">Home</a>
    <a href="/help">Help</a>
    <a class="btn btn-sm" href="/console">Sign in</a>
  </nav>
</header>

<main class="wrap page error-page">
  <p class="error-code">ERROR %%STATUS%%</p>
  <h1>%%TITLE%%</h1>
  <p class="lede">%%MESSAGE%%</p>
  %%DETAIL%%
  <div class="error-actions">
    <a class="btn btn-primary" href="/">Go to the home page</a>
    <a class="btn" href="/console">Open the console</a>
    <a class="btn" href="/help">Get help</a>
  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span>CyberLogix AI</span>
    <span class="lineage">A product of MTRX Horizyn</span>
  </div>
</footer>
</body>
</html>
