<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="CyberLogix AI">
  <!--
    Three readings, a limit drawn across them, and one that has gone over
    it. The whole product in a mark.

    A sibling of the Cybersalus logo rather than a copy: that one draws
    its subject out of routed board traces, so this keeps the grammar —
    square runs, a pad at every terminus, violet into blue — and stands
    the fan of lines upright, where a rising trace means what it means.

    Read left to right it is time. The first two are fine and differ
    slightly, because real readings do. The third is not.

    It survives one colour. The breach is taller and carries a heavier
    pad, so with the alarm red stripped out — a black-and-white invoice,
    an embossed card — it is still plainly the odd one out. A mark that
    only works in colour is a mark that works in half the places it has
    to go.
  -->
  <defs>
    <linearGradient id="clx-wash" x1="6" y1="28" x2="26" y2="6"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3FE4"/>
      <stop offset="0.5" stop-color="#4560EA"/>
      <stop offset="1" stop-color="#2F8BE8"/>
    </linearGradient>
  </defs>

  <!-- the limit -->
  <path d="M3.5 13.6 H27" fill="none" stroke="#FF6B4A" stroke-width="1.4"
        stroke-dasharray="3.4 3" stroke-linecap="round" opacity="0.8"/>

  <!-- two readings inside it -->
  <g fill="none" stroke="url(#clx-wash)" stroke-width="2.7"
     stroke-linecap="round">
    <path d="M8 28 V19.6"/>
    <path d="M16 28 V16.9"/>
  </g>
  <g fill="url(#clx-wash)">
    <circle cx="8" cy="19.6" r="2.1"/>
    <circle cx="16" cy="16.9" r="2.1"/>
  </g>

  <!-- and the one that is not -->
  <path d="M24 28 V5.6" fill="none" stroke="#FF6B4A" stroke-width="2.9"
        stroke-linecap="round"/>
  <circle cx="24" cy="5.6" r="2.9" fill="#FF6B4A"/>
</svg>
