<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Owlogix AI">
  <!--
    An owl, because an owl is awake at 3am and watching, which is the
    whole product. Drawn in the same language as the circuit mark it
    replaces: one gradient, round-capped traces, and a plated pad where
    a trace ends, here at the tip of each ear.

    The head is one trace: up to the ear pads, in across the brow, and
    round the chin. The eyes are the biggest thing on it, on purpose.
    They are what reads at 16px when nothing else does.
  -->
  <defs>
    <linearGradient id="owl-wash" x1="16" y1="30" x2="16" y2="3"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3FE4"/>
      <stop offset="0.5" stop-color="#5A4DE8"/>
      <stop offset="1" stop-color="#2F8BE8"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#owl-wash)" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M5 6 L10.5 10.5 H21.5 L27 6 V19 C27 25.5 22 29.5 16 29.5
             C10 29.5 5 25.5 5 19 Z" stroke-width="2.4"/>
    <path d="M14.4 20.8 L16 23 L17.6 20.8" stroke-width="1.9"/>
  </g>

  <!-- the eyes: a plated pad each, with the gradient for a pupil -->
  <g fill="#FFFFFF" stroke="url(#owl-wash)" stroke-width="1.8">
    <circle cx="11.4" cy="16" r="3.7"/>
    <circle cx="20.6" cy="16" r="3.7"/>
  </g>
  <g fill="url(#owl-wash)">
    <circle cx="11.4" cy="16" r="1.5"/>
    <circle cx="20.6" cy="16" r="1.5"/>
  </g>

  <!-- a pad at each ear tip, where the trace ends -->
  <g fill="#FFFFFF" stroke="url(#owl-wash)" stroke-width="1.3">
    <circle cx="5" cy="5" r="1.9"/>
    <circle cx="27" cy="5" r="1.9"/>
  </g>
</svg>
