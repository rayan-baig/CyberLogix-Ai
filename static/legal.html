<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CyberLogix AI — Agreements</title>
<meta name="description" content="The Master Subscription Agreement, Loss Assurance terms, service level, privacy statement and acceptable use. Generated from the running system, so the figures cannot drift from the product.">

<link rel="stylesheet" href="/static/theme.css">
<script src="/static/circuit.js" defer></script>
<style>
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }
@media (max-width: 720px) { .wrap { padding: 0 20px; } }

.top {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 18px;
  padding: 16px 28px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.top .brand { text-decoration: none; color: var(--ink); }
.top .brand-name { font-size: 17px; }
.top nav { display: flex; gap: 22px; margin-left: auto; align-items: center; }
.top nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
.top nav a:hover, .top nav a:focus-visible { color: var(--ink); }
/* Five words of navigation do not fit a phone. Measured at 390px the row
   ran to 405 and the whole page scrolled sideways, which on the page that
   takes somebody's money reads as broken before they have typed anything.
   The brand shrinks to its mark and the links tighten; nothing is hidden,
   because every one of them is a place somebody might need to get to. */
@media (max-width: 720px) {
  .top { padding: 14px 16px; gap: 10px; }
  .top .brand-name { display: none; }
  .top nav { gap: 14px; }
  .top nav a { font-size: 13px; }
}

.shell { display: grid; grid-template-columns: 260px 1fr; gap: 44px;
         padding: 48px 0 90px; align-items: start; }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; gap: 26px; } }

/* --- the picker ----------------------------------------------------- */
.picker { position: sticky; top: 88px; display: grid; gap: 6px; }
@media (max-width: 900px) { .picker { position: static; } }
.picker button {
  text-align: left; font: inherit; font-size: 14px; cursor: pointer;
  padding: 11px 14px; border-radius: 10px; color: var(--muted);
  background: transparent; border: 1px solid transparent;
  transition: color .18s var(--ease), background .18s var(--ease);
}
.picker button:hover { color: var(--ink); background: var(--surface); }
.picker button[aria-current="true"] {
  color: var(--ink); background: var(--surface); border-color: var(--border);
}

/* --- the document --------------------------------------------------- */
.doc { max-width: 74ch; }
.doc h1 {
  font-family: var(--display); font-weight: 400;
  font-size: clamp(28px, 3.6vw, 40px); line-height: 1.1;
  letter-spacing: -0.015em; margin: 0 0 8px; color: var(--ink);
}
.doc h2 {
  font-family: var(--display); font-weight: 400; font-size: 21px;
  margin: 40px 0 12px; color: var(--ink);
  padding-top: 20px; border-top: 1px solid var(--border);
}
.doc p { color: var(--muted); line-height: 1.72; margin: 0 0 16px; }
.doc strong { color: var(--ink); font-weight: 600; }
.doc ul { color: var(--muted); line-height: 1.72; margin: 0 0 16px;
          padding-left: 22px; }
.doc li { margin-bottom: 7px; }
.doc code {
  font-family: var(--mono); font-size: 12.5px; color: var(--accent-cyan);
  background: var(--surface); padding: 2px 6px; border-radius: 5px;
}
.doc blockquote {
  margin: 0 0 28px; padding: 14px 18px;
  border-left: 2px solid color-mix(in srgb, var(--warn, #E0A030) 70%, transparent);
  background: color-mix(in srgb, var(--warn, #E0A030) 8%, transparent);
  border-radius: 0 10px 10px 0;
  color: var(--muted); font-size: 14px; line-height: 1.65;
}
.doc table {
  width: 100%; border-collapse: collapse; margin: 0 0 20px; font-size: 14px;
  display: block; overflow-x: auto;
}
.doc th, .doc td {
  text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border);
  color: var(--muted);
}
.doc th { color: var(--ink); font-weight: 600; white-space: nowrap; }

.stamp {
  font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  margin: 28px 0 0; word-break: break-all;
}

footer {
  border-top: 1px solid var(--border); padding: 26px 0;
  color: var(--muted); font-size: 13px;
}
footer nav { display: flex; gap: 20px; margin-left: auto; flex-wrap: wrap; }
footer a { color: var(--muted); text-decoration: none; }
footer a:hover, footer a:focus-visible { color: var(--ink); }
</style>
</head>
<body>
<canvas id="circuit" class="circuit" aria-hidden="true"></canvas>
<div class="circuit-veil" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="/" aria-label="CyberLogix AI home">
    <img src="/static/logo.svg" alt="" width="26" height="26">
    <span class="brand-name">CyberLogix AI</span>
  </a>
  <nav aria-label="Elsewhere">
    <a href="/">Home</a>
    <a href="/console">Console</a>
    <a href="/docs">API</a>
  </nav>
</header>

<main class="wrap shell">
  <nav class="picker" id="picker" aria-label="Agreements"></nav>

  <div>
    <article class="doc" id="doc">
      <p>Loading the agreements…</p>
    </article>
  </div>
</main>

<footer>
  <div class="wrap" style="display:flex;flex-wrap:wrap;gap:16px;align-items:center;width:100%">
    <span>CyberLogix AI</span>
    <span class="lineage">A Cybersalus company</span>
    <nav aria-label="Elsewhere">
      <a href="/">Home</a>
      <a href="/console">Console</a>
      <a href="/api/legal">JSON</a>
    </nav>
  </div>
</footer>

<script>
"use strict";

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[c]));

/* A deliberately tiny Markdown renderer.
 *
 * The alternative is pulling a library over a CDN onto the page that
 * carries the liability cap, which is exactly the page that should have
 * the fewest moving parts. This handles the six constructs the documents
 * actually use and ignores everything else.
 *
 * Every line is escaped BEFORE any markup is added, so nothing in the
 * source text can introduce a tag. The inline pass then only ever emits
 * <strong> and <code>, and only around content that has already been
 * escaped. Adding a construct here means checking that property again.
 */
function inline(text) {
  return esc(text)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
}

function renderMarkdown(src) {
  const out = [];
  const lines = String(src).split("\n");
  let list = null;
  let table = null;

  const closeList = () => { if (list) { out.push("</ul>"); list = null; } };
  const closeTable = () => { if (table) { out.push("</tbody></table>"); table = null; } };
  const closeAll = () => { closeList(); closeTable(); };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    if (!trimmed) { closeAll(); continue; }

    // Table rows. The separator row (|---|---|) is what turns the row
    // before it into a header, so it is looked for rather than rendered.
    if (trimmed.startsWith("|") && trimmed.endsWith("|")) {
      const cells = trimmed.slice(1, -1).split("|").map((c) => c.trim());
      const isSeparator = cells.every((c) => /^:?-{2,}:?$/.test(c));
      if (isSeparator) continue;
      const nextIsSeparator = (lines[i + 1] || "").trim()
        .match(/^\|(\s*:?-{2,}:?\s*\|)+$/);
      if (!table) {
        closeList();
        out.push("<table>");
        table = nextIsSeparator ? "head" : "body";
        out.push(table === "head" ? "<thead>" : "<tbody>");
      }
      const tag = table === "head" ? "th" : "td";
      out.push("<tr>" + cells.map((c) => `<${tag}>${inline(c)}</${tag}>`)
        .join("") + "</tr>");
      if (table === "head") { out.push("</thead><tbody>"); table = "body"; }
      continue;
    }
    closeTable();

    if (trimmed.startsWith("* ")) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push(`<li>${inline(trimmed.slice(2))}</li>`);
      continue;
    }
    closeList();

    if (trimmed.startsWith("> ")) {
      out.push(`<blockquote>${inline(trimmed.slice(2))}</blockquote>`);
      continue;
    }
    if (trimmed.startsWith("## ")) {
      out.push(`<h2>${inline(trimmed.slice(3))}</h2>`);
      continue;
    }
    if (trimmed.startsWith("# ")) {
      out.push(`<h1>${inline(trimmed.slice(2))}</h1>`);
      continue;
    }

    // A paragraph runs until a blank line. Joining the wrapped source
    // lines matters: the documents are hard-wrapped at 72 columns and
    // rendering each line as its own paragraph would shred them.
    const para = [trimmed];
    while (i + 1 < lines.length && lines[i + 1].trim()
           && !/^([*>#]|\|)/.test(lines[i + 1].trim())) {
      para.push(lines[++i].trim());
    }
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }

  closeAll();
  return out.join("\n");
}

const picker = document.getElementById("picker");
const docEl = document.getElementById("doc");
let catalogue = [];

function slugFromHash() {
  const wanted = (location.hash || "").replace(/^#/, "");
  return catalogue.some((d) => d.slug === wanted) ? wanted : "terms";
}

async function show(slug) {
  for (const button of picker.querySelectorAll("button")) {
    button.setAttribute("aria-current", String(button.dataset.slug === slug));
  }
  try {
    const resp = await fetch(`/api/legal/${encodeURIComponent(slug)}`);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const doc = await resp.json();
    // Version and date are already the second line of the document; the
    // stamp adds only the thing the document cannot state about itself.
    docEl.innerHTML = renderMarkdown(doc.body_markdown)
      + `<p class="stamp">SHA-256 of this text: ${esc(doc.sha256)}</p>`;
    window.scrollTo({ top: 0, behavior: "smooth" });
  } catch (err) {
    docEl.innerHTML = `<p>That agreement could not be loaded
      (${esc(err.message)}). It is served from
      <code>/api/legal/${esc(slug)}</code>.</p>`;
  }
}

async function boot() {
  try {
    const resp = await fetch("/api/legal");
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const body = await resp.json();
    catalogue = body.documents || [];

    picker.innerHTML = catalogue.map((d) =>
      `<button type="button" data-slug="${esc(d.slug)}">${esc(d.title)}</button>`
    ).join("");
    for (const button of picker.querySelectorAll("button")) {
      button.addEventListener("click", () => {
        location.hash = button.dataset.slug;
      });
    }

    window.addEventListener("hashchange", () => show(slugFromHash()));
    show(slugFromHash());
  } catch (err) {
    docEl.innerHTML = `<p>The agreements could not be loaded
      (${esc(err.message)}). They are served from
      <code>/api/legal</code>.</p>`;
  }
}

boot();
</script>
</body>
</html>
