<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="CyberLogix AI">
  <!--
    The favicon cut. Same mark with the two feeds removed: at 16px in a
    browser tab a 1.6px trace is not a trace, it is a smudge beside the
    thing you were trying to draw. What survives is the silhouette, which
    is the only part that has to.
  -->
  <defs>
    <linearGradient id="clx-mark" x1="4" y1="29" x2="28" y2="6"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22B8E6"/>
      <stop offset="0.55" stop-color="#2F6BE8"/>
      <stop offset="1" stop-color="#6B3FE4"/>
    </linearGradient>
  </defs>
  <path d="M16 6 V20" fill="none" stroke="url(#clx-mark)" stroke-width="7"
        stroke-linecap="round"/>
  <circle cx="16" cy="23.2" r="6.4" fill="url(#clx-mark)"/>
  <circle cx="16" cy="23.2" r="1.9" fill="#05070D"/>
</svg>
