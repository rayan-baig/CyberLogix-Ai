<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Owlogix AI">
  <!--
    The favicon cut: the head and the eyes only, heavier strokes, no ear
    pads. The beak stays: without it, a head with pointed ears and two
    eyes reads as a cat at 16 pixels.
  -->
  <defs>
    <linearGradient id="owl-mark" x1="16" y1="30" x2="16" y2="3"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C3FE4"/>
      <stop offset="0.5" stop-color="#5A4DE8"/>
      <stop offset="1" stop-color="#2F8BE8"/>
    </linearGradient>
  </defs>
  <path d="M4.5 4.5 L10.5 9.5 H21.5 L27.5 4.5 V19 C27.5 25.8 22.3 30 16 30
           C9.7 30 4.5 25.8 4.5 19 Z" fill="none" stroke="url(#owl-mark)"
        stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14.2 23 L16 25.6 L17.8 23" fill="none" stroke="url(#owl-mark)"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#FFFFFF" stroke="url(#owl-mark)" stroke-width="2.2">
    <circle cx="11.3" cy="17" r="4.2"/>
    <circle cx="20.7" cy="17" r="4.2"/>
  </g>
  <g fill="url(#owl-mark)">
    <circle cx="11.3" cy="17" r="1.9"/>
    <circle cx="20.7" cy="17" r="1.9"/>
  </g>
</svg>
