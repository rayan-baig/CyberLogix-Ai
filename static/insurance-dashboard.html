<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/signup.css">
<link rel="stylesheet" href="/static/insurers.css">
<link rel="stylesheet" href="/static/utilities.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="%%APP_NAME%% home">
    <img src="/static/logo.svg" alt="" width="26" height="26">
    <span class="brand-name">%%APP_NAME%%</span>
  </a>
  <nav aria-label="Elsewhere">
    <a href="/insurance-partners">Partners</a>
    <button type="button" class="linkish" id="forget" hidden>Sign out</button>
  </nav>
</header>

<main class="wrap dash">
  <h1 id="title">Partner dashboard</h1>

  <form class="card gate" id="gate">
    <p class="sub">Paste the dashboard key from your approval email.</p>
    <div class="field">
      <label for="key">Dashboard key</label>
      <input id="key" type="password" autocomplete="off" required>
    </div>
    <button class="go" type="submit">Open</button>
  </form>

  <p class="error" id="error" hidden></p>

  <div id="board" hidden>
    <section class="card">
      <h2>Your code</h2>
      <p class="codeline"><code id="code"></code></p>
      <p class="sub" id="link"></p>
      <button type="button" class="btn-copy" id="copy">Copy the sign-up link</button>
      <p class="small" id="terms"></p>
    </section>

    <section class="tiles" id="tiles"></section>

    <section class="card">
      <h2>Businesses that joined with your code</h2>
      <div id="businesses"></div>
    </section>

    <section class="card">
      <h2>Payments to you</h2>
      <div id="payouts"></div>
    </section>

    <p class="small" id="privacy"></p>
  </div>
</main>

<script src="/static/insurance-dashboard.js"></script>
</body>
</html>
