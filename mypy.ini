# Type checking for the code that handles money, and only that code.
#
# These modules price, invoice, take payment, give credit and keep the
# books. A None where a number was expected, or a figure that is not
# rounded to the cent, is a wrong bill. The rest of the app is not checked here on
# purpose: switching it on everywhere buries the few findings that matter
# under hundreds that do not.
#
# Run it with:  python -m mypy
[mypy]
python_version = 3.11
files =
    books.py,
    contracts.py,
    credits.py,
    enterprise_billing.py,
    invoicing.py,
    margin.py,
    payments.py,
    pricing.py,
    referrals.py

# Other modules are read for their types (Invoice, Tenant, ...) but their
# own errors are not reported. That is what keeps this narrow.
follow_imports = silent
ignore_missing_imports = True

# Check the bodies of functions even where they carry no annotations.
check_untyped_defs = True
strict_equality = True
warn_unreachable = True
warn_redundant_casts = True
warn_unused_ignores = True
extra_checks = True
